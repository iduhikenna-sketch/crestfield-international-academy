<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | Crestfield International Academy</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0b1f3a, #123f63);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 18px;
      padding: 35px 30px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    }

    .school-icon {
      width: 75px;
      height: 75px;
      margin: 0 auto 15px;
      border-radius: 50%;
      background: #0b1f3a;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: bold;
    }

    h1 {
      text-align: center;
      color: #0b1f3a;
      font-size: 24px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 28px;
    }

    label {
      display: block;
      color: #333;
      font-weight: bold;
      margin-bottom: 8px;
    }

    select,
    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin-bottom: 18px;
      font-size: 15px;
      outline: none;
    }

    select:focus,
    input:focus {
      border-color: #123f63;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #0b1f3a;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-btn:hover {
      background: #123f63;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #0b1f3a;
      text-decoration: none;
      font-size: 14px;
    }

    .back-home:hover {
      text-decoration: underline;
    }

    .demo-note {
      margin-top: 22px;
      padding: 12px;
      background: #f4f6f8;
      border-radius: 10px;
      text-align: center;
      color: #666;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="login-container">

    <div class="school-icon">C</div>

    <h1>Crestfield International Academy</h1>

    <p class="subtitle">School Portal Login</p>

    <form onsubmit="loginUser(event)">

      <label for="userType">Login As</label>

      <select id="userType" required>
        <option value="">Select account type</option>
        <option value="Admin">Admin</option>
        <option value="Teacher">Teacher</option>
        <option value="Parent">Parent</option>
        <option value="Student">Student</option>
      </select>

      <label for="username">Username / ID</label>

      <input
        type="text"
        id="username"
        placeholder="Enter your username or ID"
        required
      >

      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
      >

      <button type="submit" class="login-btn">
        Login
      </button>

    </form>

    <a href="index.html" class="back-home">
      ← Back to School Website
    </a>

    <div class="demo-note">
      School Portal • Crestfield International Academy
    </div>

  </div>

  <script>
    function loginUser(event) {
      event.preventDefault();

      const userType = document.getElementById("userType").value;

      if (userType === "Admin") {
        window.location.href = "admin-dashboard.html";
      } 
      else if (userType === "Teacher") {
        window.location.href = "teacher-dashboard.html";
      } 
      else if (userType === "Parent") {
        window.location.href = "parent-dashboard.html";
      } 
      else if (userType === "Student") {
        window.location.href = "student-dashboard.html";
      }
    }
  </script>

</body>
</html>
