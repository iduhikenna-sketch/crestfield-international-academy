<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>View Student Results | Crestfield International Academy</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #123c69;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      margin-bottom: 8px;
    }

    .container {
      width: 92%;
      max-width: 1100px;
      margin: 30px auto;
    }

    .back-button {
      display: inline-block;
      background: #123c69;
      color: white;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 6px;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .card h2 {
      color: #123c69;
      margin-bottom: 20px;
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
    }

    th,
    td {
      padding: 12px;
      border: 1px solid #ddd;
      text-align: left;
    }

    th {
      background: #123c69;
      color: white;
    }

    tr:nth-child(even) {
      background: #f8f9fa;
    }

    .empty-message {
      text-align: center;
      padding: 20px;
      color: #777;
    }

    @media (max-width: 600px) {
      .container {
        width: 95%;
      }

      .card {
        padding: 18px;
      }

      header h1 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Crestfield International Academy</h1>
    <p>Teacher Portal — Student Results</p>
  </header>

  <div class="container">

    <a href="teacher-dashboard.html" class="back-button">
      ← Back to Teacher Dashboard
    </a>

    <div class="card">

      <h2>View Student Results</h2>

      <div class="filters">

        <input
          type="text"
          id="search"
          placeholder="Search student name or ID..."
          onkeyup="filterResults()"
        >

        <select id="classFilter" onchange="filterResults()">
          <option value="">All Classes</option>
          <option value="JSS 1">JSS 1</option>
          <option value="JSS 2">JSS 2</option>
          <option value="JSS 3">JSS 3</option>
          <option value="SS 1">SS 1</option>
          <option value="SS 2">SS 2</option>
          <option value="SS 3">SS 3</option>
        </select>

        <input
          type="text"
          id="subjectFilter"
          placeholder="Search subject..."
          onkeyup="filterResults()"
        >

      </div>

      <div class="table-container">

        <table>

          <thead>
            <tr>
              <th>Student Name</th>
              <th>Student ID</th>
              <th>Class</th>
              <th>Subject</th>
              <th>Score</th>
              <th>Grade</th>
            </tr>
          </thead>

          <tbody id="resultsTable"></tbody>

        </table>

      </div>

    </div>

  </div>

  <script>

    let results =
      JSON.parse(localStorage.getItem("crestfieldResults")) || [];

    function displayResults(list = results) {

      const table = document.getElementById("resultsTable");

      table.innerHTML = "";

      if (list.length === 0) {

        table.innerHTML = `
          <tr>
            <td colspan="6" class="empty-message">
              No student results found.
            </td>
          </tr>
        `;

        return;
      }

      list.forEach(result => {

        const row = document.createElement("tr");

        row.innerHTML = `
          <td>${result.name}</td>
          <td>${result.id}</td>
          <td>${result.className}</td>
          <td>${result.subject}</td>
          <td>${result.score}</td>
          <td>${result.grade}</td>
        `;

        table.appendChild(row);

      });
    }

    function filterResults() {

      const search =
        document.getElementById("search").value.toLowerCase();

      const classFilter =
        document.getElementById("classFilter").value;

      const subjectFilter =
        document.getElementById("subjectFilter").value.toLowerCase();

      const filtered = results.filter(result => {

        const matchesSearch =
          result.name.toLowerCase().includes(search) ||
          result.id.toLowerCase().includes(search);

        const matchesClass =
          classFilter === "" ||
          result.className === classFilter;

        const matchesSubject =
          subjectFilter === "" ||
          result.subject.toLowerCase().includes(subjectFilter);

        return matchesSearch &&
               matchesClass &&
               matchesSubject;
      });

      displayResults(filtered);
    }

    displayResults();

  </script>

</body>
</html>
