<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Enter Student Results | Crestfield International Academy</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #123c69;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      margin-bottom: 8px;
    }

    .container {
      width: 92%;
      max-width: 800px;
      margin: 30px auto;
    }

    .back-button {
      display: inline-block;
      background: #123c69;
      color: white;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 6px;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .card h2 {
      color: #123c69;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 13px;
      background: #123c69;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #0d2e50;
    }

    .success-message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      background: #e8f5e9;
      color: #2e7d32;
      border-radius: 6px;
      text-align: center;
    }

    @media (max-width: 600px) {
      .container {
        width: 95%;
      }

      .card {
        padding: 18px;
      }

      header h1 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Crestfield International Academy</h1>
    <p>Teacher Portal — Enter Student Results</p>
  </header>

  <div class="container">

    <a href="teacher-dashboard.html" class="back-button">
      ← Back to Teacher Dashboard
    </a>

    <div class="card">

      <h2>Enter Student Result</h2>

      <form onsubmit="saveResult(event)">

        <label for="studentName">Student Full Name</label>
        <input
          type="text"
          id="studentName"
          placeholder="Enter student's full name"
          required
        >

        <label for="studentId">Student ID</label>
        <input
          type="text"
          id="studentId"
          placeholder="Enter student ID"
          required
        >

        <label for="className">Class</label>
        <select id="className" required>
          <option value="">Select class</option>
          <option value="JSS 1">JSS 1</option>
          <option value="JSS 2">JSS 2</option>
          <option value="JSS 3">JSS 3</option>
          <option value="SS 1">SS 1</option>
          <option value="SS 2">SS 2</option>
          <option value="SS 3">SS 3</option>
        </select>

        <label for="subject">Subject</label>
        <input
          type="text"
          id="subject"
          placeholder="Example: Mathematics"
          required
        >

        <label for="score">Score</label>
        <input
          type="number"
          id="score"
          placeholder="Enter score from 0 to 100"
          min="0"
          max="100"
          required
        >

        <button type="submit">
          Save Student Result
        </button>

        <div id="successMessage" class="success-message"></div>

      </form>

    </div>

  </div>

  <script>

    function getGrade(score) {

      if (score >= 70) {
        return "A";
      } else if (score >= 60) {
        return "B";
      } else if (score >= 50) {
        return "C";
      } else if (score >= 45) {
        return "D";
      } else if (score >= 40) {
        return "E";
      } else {
        return "F";
      }
    }

    function saveResult(event) {

      event.preventDefault();

      const name =
        document.getElementById("studentName").value.trim();

      const id =
        document.getElementById("studentId").value.trim();

      const className =
        document.getElementById("className").value;

      const subject =
        document.getElementById("subject").value.trim();

      const score =
        Number(document.getElementById("score").value);

      const grade = getGrade(score);

      const results =
        JSON.parse(localStorage.getItem("crestfieldResults")) || [];

      const newResult = {
        name: name,
        id: id,
        className: className,
        subject: subject,
        score: score,
        grade: grade
      };

      results.push(newResult);

      localStorage.setItem(
        "crestfieldResults",
        JSON.stringify(results)
      );

      const successMessage =
        document.getElementById("successMessage");

      successMessage.textContent =
        "Result saved successfully. Grade: " + grade;

      successMessage.style.display = "block";

      document.querySelector("form").reset();

    }

  </script>

</body>
</html>
