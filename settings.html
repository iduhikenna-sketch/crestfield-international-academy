<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>School Settings | Crestfield International Academy</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #123c69;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      margin-bottom: 8px;
    }

    .container {
      width: 92%;
      max-width: 800px;
      margin: 30px auto;
    }

    .back-button {
      display: inline-block;
      background: #123c69;
      color: white;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 6px;
      margin-bottom: 20px;
    }

    .back-button:hover {
      background: #0d2e50;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .card h2 {
      color: #123c69;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      margin-top: 25px;
      padding: 12px 22px;
      background: #123c69;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      background: #0d2e50;
    }

    .saved-message {
      margin-top: 15px;
      padding: 12px;
      background: #e8f5e9;
      color: #2e7d32;
      border-radius: 6px;
      display: none;
    }

    @media (max-width: 600px) {
      .container {
        width: 95%;
      }

      .card {
        padding: 18px;
      }

      header h1 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Crestfield International Academy</h1>
    <p>Administrator Portal — School Settings</p>
  </header>

  <div class="container">

    <a href="admin-dashboard.html" class="back-button">
      ← Back to Dashboard
    </a>

    <div class="card">

      <h2>School Information</h2>

      <form onsubmit="saveSettings(event)">

        <label for="schoolName">School Name</label>
        <input
          type="text"
          id="schoolName"
          placeholder="Enter school name"
          required
        >

        <label for="address">School Address</label>
        <input
          type="text"
          id="address"
          placeholder="Enter school address"
          required
        >

        <label for="phone">Phone Number</label>
        <input
          type="tel"
          id="phone"
          placeholder="Enter school phone number"
          required
        >

        <label for="email">School Email</label>
        <input
          type="email"
          id="email"
          placeholder="Enter school email"
          required
        >

        <label for="hours">Opening Hours</label>
        <input
          type="text"
          id="hours"
          placeholder="Example: Monday - Friday, 8:00 AM - 4:00 PM"
          required
        >

        <label for="description">School Description</label>
        <textarea
          id="description"
          placeholder="Enter a short description about the school"
          required
        ></textarea>

        <button type="submit">
          Save School Settings
        </button>

        <div id="savedMessage" class="saved-message">
          School settings saved successfully.
        </div>

      </form>

    </div>

  </div>

  <script>

    function loadSettings() {

      const settings =
        JSON.parse(localStorage.getItem("crestfieldSettings"));

      if (!settings) {
        return;
      }

      document.getElementById("schoolName").value =
        settings.schoolName || "";

      document.getElementById("address").value =
        settings.address || "";

      document.getElementById("phone").value =
        settings.phone || "";

      document.getElementById("email").value =
        settings.email || "";

      document.getElementById("hours").value =
        settings.hours || "";

      document.getElementById("description").value =
        settings.description || "";
    }

    function saveSettings(event) {

      event.preventDefault();

      const settings = {

        schoolName:
          document.getElementById("schoolName").value.trim(),

        address:
          document.getElementById("address").value.trim(),

        phone:
          document.getElementById("phone").value.trim(),

        email:
          document.getElementById("email").value.trim(),

        hours:
          document.getElementById("hours").value.trim(),

        description:
          document.getElementById("description").value.trim()
      };

      localStorage.setItem(
        "crestfieldSettings",
        JSON.stringify(settings)
      );

      document.getElementById("savedMessage").style.display = "block";

      setTimeout(function() {
        document.getElementById("savedMessage").style.display = "none";
      }, 3000);
    }

    loadSettings();

  </script>

</body>
</html>
